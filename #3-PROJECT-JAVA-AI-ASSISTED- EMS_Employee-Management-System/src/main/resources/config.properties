# Employee Management System Configuration File
# This file contains all configurable properties for the application

# ============================================
# Database Configuration
# ============================================
database.type=in-memory
# Supported types: in-memory, file, mysql, postgresql

# For file-based storage
database.file.path=./data/employees.db

# For MySQL/PostgreSQL (future enhancement)
# database.host=localhost
# database.port=3306
# database.name=employee_management
# database.username=root
# database.password=root


# ============================================
# Application Configuration
# ============================================

# Application name and version
app.name=Employee Management System
app.version=1.0.0
app.description=A Java-based system for managing employee records

# Enable/Disable features
app.enable.ai.features=false
app.enable.logging=true
app.enable.email.notifications=false


# ============================================
# AI/API Configuration (for future AI features)
# ============================================

# AI Service Configuration
ai.service.enabled=false
ai.service.provider=openai
# Supported providers: openai, google-palm, cohere

# OpenAI Configuration
ai.openai.api.key=YOUR_API_KEY_HERE
ai.openai.api.url=https://api.openai.com/v1
ai.openai.model=gpt-3.5-turbo
ai.openai.timeout=30000

# API Rate Limiting
ai.api.rate.limit=100
ai.api.rate.window.seconds=3600

# AI Features
ai.feature.salary.prediction=false
ai.feature.employee.insights=false
ai.feature.department.analytics=false


# ============================================
# Logging Configuration
# ============================================

# Log levels: DEBUG, INFO, WARN, ERROR
logging.level=INFO
logging.level.app=INFO
logging.level.database=DEBUG

# Log output
logging.file.enabled=true
logging.file.path=./logs/application.log
logging.file.max.size=10MB
logging.file.max.backups=5


# ============================================
# Business Logic Configuration
# ============================================

# Employee salary constraints
employee.salary.minimum=10000
employee.salary.maximum=1000000

# Employee ID auto-generation
employee.id.start=1001
employee.id.increment=1

# Department list (comma-separated)
departments.allowed=IT,HR,Sales,Marketing,Finance,Operations

# Salary calculation
salary.bonus.percentage=10
salary.hra.percentage=15
salary.da.percentage=8


# ============================================
# Email Notification Configuration (for future use)
# ============================================

email.enabled=false
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.username=your-email@gmail.com
email.smtp.password=your-app-password
email.from.address=noreply@employeemanagement.com

# Email templates
email.template.new.employee=templates/new_employee_welcome.html
email.template.salary.slip=templates/salary_slip.html


# ============================================
# Data Export Configuration
# ============================================

# Export formats: CSV, EXCEL, JSON, PDF
export.default.format=CSV
export.output.directory=./exports/

# Excel export settings
export.excel.include.charts=false

# CSV export settings
export.csv.delimiter=,
export.csv.encoding=UTF-8


# ============================================
# Backup Configuration
# ============================================

backup.enabled=true
backup.directory=./backups/
backup.schedule=DAILY
# Schedule options: NEVER, DAILY, WEEKLY, MONTHLY

# Automatic backup time (HH:mm format, 24-hour)
backup.time=02:00

# Retain backups for X days
backup.retention.days=30


# ============================================
# UI/Console Configuration
# ============================================

# Console display settings
console.color.enabled=true
console.clear.screen=true
console.table.width=80

# Menu display options
menu.show.welcome.message=true
menu.auto.clear.after.operation=true
menu.operation.timeout.seconds=300


# ============================================
# Performance Configuration
# ============================================

# Connection pool size (for database operations)
database.connection.pool.size=10
database.connection.timeout=5000

# Cache configuration
cache.enabled=false
cache.type=memory
cache.ttl.minutes=30

# Batch operation settings
batch.operation.size=100
batch.processing.timeout.seconds=60


# ============================================
# Security Configuration
# ============================================

# Data encryption (for future enhancement)
security.encryption.enabled=false
security.encryption.algorithm=AES-256

# Audit logging
security.audit.logging.enabled=true
security.audit.log.file=./logs/audit.log

# User authentication (for future enhancement)
security.authentication.required=false
security.password.min.length=8


# ============================================
# Development/Debug Configuration
# ============================================

# Development mode - shows additional debug info
dev.mode=false

# Print execution time for operations
dev.show.execution.time=false

# Print SQL queries (if using database)
dev.show.sql.queries=false

# Memory profiling
dev.profile.memory=false


# ============================================
# Internationalization (i18n) - Future Enhancement
# ============================================

# Default language
app.language=en_US
# Supported languages: en_US, es_ES, fr_FR, de_DE

# Locale settings
app.locale.date.format=dd/MM/yyyy
app.locale.currency=USD
app.locale.timezone=UTC

